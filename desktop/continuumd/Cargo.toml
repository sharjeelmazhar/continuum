[package]
name = "continuumd"
description = "Continuum daemon: discovery, TLS sessions, plugins and D-Bus API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
continuum-proto = { path = "../continuum-proto" }
futures-util = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
ring = "0.17.14"
rustix = { version = "1.1.6", features = ["fs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "6.1.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

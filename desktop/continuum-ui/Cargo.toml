[package]
name = "continuum-ui"
description = "Continuum GTK4/libadwaita app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
futures-util = "0.3.34"
glib = "0.22.10"
gstreamer = "0.25.4"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = "6.1.0"

# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub Release.
# Versions with a suffix (v1.0.0-beta.1) are marked as pre-releases; the rest become "latest",
# so https://github.com/…/releases/latest/download/Continuum.apk always gives the newest app.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]] || { echo "bad tag: $GITHUB_REF_NAME"; exit 1; }
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          pre=false; [ -n "${BASH_REMATCH[4]}" ] && pre=true
          echo "name=$v" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"; echo "pre=$pre" >> "$GITHUB_OUTPUT"

      - name: Test, then build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONTINUUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CONTINUUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONTINUUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export CONTINUUM_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$CONTINUUM_KEYSTORE"
          ./gradlew testDebugUnitTest assembleRelease --console=plain \
            -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}
          rm -f "$CONTINUUM_KEYSTORE"
          out="Continuum-${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$out"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$RUNNER_TEMP/$out"
          (cd "$RUNNER_TEMP" && sha256sum "$out" > "$out.sha256" && cp "$out" Continuum.apk)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [ "${{ steps.ver.outputs.pre }}" = true ] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag --title "Continuum ${{ steps.ver.outputs.name }}" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes/$GITHUB_REF_NAME.md" \
            "$RUNNER_TEMP/Continuum-${{ steps.ver.outputs.name }}.apk" \
            "$RUNNER_TEMP/Continuum-${{ steps.ver.outputs.name }}.apk.sha256" \
            "$RUNNER_TEMP/Continuum.apk"

  # Prebuilt desktop bundle (Ubuntu 24.04 or newer, x86_64) and the deb, rpm and Arch packages.
  desktop:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev libdbus-1-dev libgstreamer1.0-dev pkg-config rpm
          cd desktop && cargo build --release --locked -p continuumd -p continuum-ui
      - name: Bundle and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"; d="Continuum-desktop-$v"
          mkdir -p "$d/desktop/target/release" "$d/scripts"
          cp desktop/target/release/continuumd desktop/target/release/continuum-ui "$d/desktop/target/release/"
          cp -r desktop/data "$d/desktop/"
          cp scripts/install-desktop.sh "$d/scripts/"
          cp LICENSE "$d/"
          printf '#!/usr/bin/env bash\nexec "$(dirname "$0")/scripts/install-desktop.sh" "$@"\n' > "$d/install.sh"
          chmod +x "$d/install.sh" "$d/scripts/install-desktop.sh"
          tar czf "$d-x86_64.tar.gz" "$d"
          sha256sum "$d-x86_64.tar.gz" > "$d-x86_64.tar.gz.sha256"
          gh release upload "$GITHUB_REF_NAME" "$d-x86_64.tar.gz" "$d-x86_64.tar.gz.sha256"
      # Packages for the apt, dnf and pacman repositories (published by the Website workflow).
      - name: Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaging/build-packages.sh "${GITHUB_REF_NAME#v}" desktop/target/release pkgs
          gh release upload "$GITHUB_REF_NAME" pkgs/*
          gh workflow run pages.yml --ref main
